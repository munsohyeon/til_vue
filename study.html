<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    map 비파괴 메소드, 기존 배열을 변형해서 새로운 배열을 만들 때 사용. 특징 원본과 길이가 같다!!!
    filter 주어진 함수의 테스트를 통과하는 모든 요소를 모아 새로운 배열로 반환한다.
    reduce 각 요소에 대해 주어진 reducer함수를 실행하고 하나의 결과값을 반환한다.
    find 주어진 판별 함수를 만족하는 첫번째 요소의 값을 반환한다. 그런 요소가 없다면 undefined를 반환한다.
</body>
</html>
